services:
  api:
    build: .
    container_name: api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/transferencias
      JWT_SECRET: ${JWT_SECRET:-segredo-padrao-apenas-para-desenvolvimento}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: banco-transferencias
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transferencias
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transferencias"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  dados-postgres:
